<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('สมัครสมาชิก')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: alert}"></div>

    <div class="card auth-card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">สมัครสมาชิก</h1>

            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">ชื่อผู้ใช้</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{username}">error</div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">อีเมล</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}">error</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{password}">error</div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">ยืนยันรหัสผ่าน</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                           th:classappend="${confirmError} ? 'is-invalid'" autocomplete="new-password" required>
                    <div class="invalid-feedback" th:text="${confirmError}">error</div>
                </div>
                <div class="mb-3">
                    <label for="fullName" class="form-label">ชื่อ-นามสกุล</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{fullName}">error</div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">เบอร์โทร (ไม่บังคับ)</label>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{phone}">error</div>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">ที่อยู่ (ไม่บังคับ)</label>
                    <input type="text" id="address" th:field="*{address}" class="form-control"
                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{address}">error</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">สมัครสมาชิก</button>
            </form>

            <p class="mt-3 mb-0 text-center small">
                มีบัญชีแล้ว? <a th:href="@{/login}">เข้าสู่ระบบ</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
