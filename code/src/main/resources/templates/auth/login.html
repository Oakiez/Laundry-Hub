<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('เข้าสู่ระบบ')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: alert}"></div>

    <div class="card auth-card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">เข้าสู่ระบบ</h1>

            <div class="alert alert-danger" th:if="${param.error}">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
            <div class="alert alert-info" th:if="${param.logout}">ออกจากระบบเรียบร้อยแล้ว</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">ชื่อผู้ใช้</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
            </form>

            <p class="mt-3 mb-0 text-center small">
                ยังไม่มีบัญชี? <a th:href="@{/register}">สมัครสมาชิก</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
