<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('เครื่องซักและอบ')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: alert}"></div>
    <h1 th:text="${staffBoard ? 'จัดการสถานะเครื่อง' : 'เลือกเครื่องซักหรืออบ'}"></h1>
    <p class="text-muted">สถานะด้านล่างเป็นสถานะปัจจุบัน ระบบจะตรวจช่วงเวลาว่างอีกครั้งเมื่อจอง</p>
    <form method="get" th:action="@{${boardPath}}" class="row g-2 mb-4">
        <div class="col-md-4"><label for="branchId" class="form-label">สาขา</label>
            <select id="branchId" name="branchId" class="form-select">
                <option value="">ทุกสาขา</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == branchId}"></option>
            </select></div>
        <div class="col-md-3"><label for="type" class="form-label">ประเภท</label>
            <select id="type" name="type" class="form-select"><option value="">ทุกประเภท</option>
                <option th:each="t : ${types}" th:value="${t}" th:selected="${t == selectedType}" th:text="${t.name() == 'WASHER' ? 'เครื่องซัก' : 'เครื่องอบ'}"></option>
            </select></div>
        <div class="col-md-3"><label for="status" class="form-label">สถานะ</label>
            <select id="status" name="status" class="form-select"><option value="">ทุกสถานะ</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option>
            </select></div>
        <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">ค้นหา</button></div>
    </form>
    <p th:if="${machines.empty}" class="alert alert-info">ไม่พบเครื่องตามเงื่อนไขที่เลือก</p>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="m : ${machines.content}">
            <article class="card h-100"><div class="card-body">
                <h2 class="h5" th:text="${m.name}"></h2>
                <p><span th:text="${m.machineType.name() == 'WASHER' ? 'เครื่องซัก' : 'เครื่องอบ'}"></span> · สาขา <span th:text="${m.branchId}"></span></p>
                <p>สถานะ: <strong th:text="${m.status}"></strong></p>
                <p>เริ่มต้น <span th:text="${m.basePrice}"></span> บาท + <span th:text="${m.pricePerMinute}"></span> บาท/นาที</p>
                <a class="btn btn-outline-primary" th:href="@{/machines/{id}(id=${m.id})}">รายละเอียด</a>
                <a sec:authorize="hasRole('CUSTOMER')" th:if="${m.status.name() != 'OUT_OF_SERVICE'}" class="btn btn-primary" th:href="@{/machines/{id}/book(id=${m.id})}">จอง</a>
                <form th:if="${staffBoard}" th:action="@{/staff/machines/{id}/status(id=${m.id})}" method="post" class="mt-3 d-flex gap-2">
                    <select name="status" class="form-select" th:attr="aria-label=${'สถานะเครื่อง ' + m.name}" th:disabled="${m.status.name() == 'IN_USE'}">
                        <option value="AVAILABLE" th:selected="${m.status.name() == 'AVAILABLE'}">พร้อมใช้</option>
                        <option value="OUT_OF_SERVICE" th:selected="${m.status.name() == 'OUT_OF_SERVICE'}">ปิดซ่อม</option>
                    </select>
                    <button class="btn btn-outline-secondary" th:disabled="${m.status.name() == 'IN_USE'}">บันทึก</button>
                </form>
            </div></article>
        </div>
    </div>
    <nav class="d-flex gap-3 align-items-center mt-4" aria-label="หน้ารายการเครื่อง">
        <a th:if="${machines.hasPrevious()}" th:href="@{${boardPath}(page=${machines.number - 1},branchId=${branchId},status=${selectedStatus},type=${selectedType})}">ก่อนหน้า</a>
        <span th:text="${'หน้า ' + (machines.number + 1)}"></span>
        <a th:if="${machines.hasNext()}" th:href="@{${boardPath}(page=${machines.number + 1},branchId=${branchId},status=${selectedStatus},type=${selectedType})}">ถัดไป</a>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body></html>
