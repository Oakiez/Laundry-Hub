<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="table(sessions, showOwner)">
    <p th:if="${sessions.empty}" class="alert alert-info">ยังไม่มีรอบใช้งาน</p>
    <div class="table-responsive" th:unless="${sessions.empty}"><table class="table align-middle">
        <thead><tr><th>รอบ</th><th>เครื่อง</th><th th:if="${showOwner}">ลูกค้า</th><th>เวลาเริ่ม–จบ</th><th>ยอด (บาท)</th><th>สถานะ</th><th>ดำเนินการ</th></tr></thead>
        <tbody><tr th:each="s : ${sessions.content}">
            <td th:text="${s.id}"></td><td><a th:href="@{/machines/{id}(id=${s.machineId})}" th:text="${s.machineId}"></a></td>
            <td th:if="${showOwner}" th:text="${s.userId}"></td>
            <td><span th:text="${#temporals.format(s.startTime, 'dd/MM/yyyy HH:mm')}"></span><br><span th:text="${#temporals.format(s.endTime, 'dd/MM/yyyy HH:mm')}"></span></td>
            <td th:text="${s.amount}"></td><td th:text="${s.status}"></td>
            <td><div class="d-flex gap-2">
                <form th:if="${s.status.name() == 'RESERVED'}" th:action="@{/sessions/{id}/start(id=${s.id})}" method="post"><button class="btn btn-success btn-sm">เริ่มใช้</button></form>
                <form th:if="${s.status.name() == 'RESERVED'}" th:action="@{/sessions/{id}/cancel(id=${s.id})}" method="post"><button class="btn btn-outline-danger btn-sm">ยกเลิก</button></form>
                <form th:if="${s.status.name() == 'IN_USE'}" th:action="@{/sessions/{id}/finish(id=${s.id})}" method="post"><button class="btn btn-primary btn-sm">จบรอบ</button></form>
            </div></td>
        </tr></tbody>
    </table></div>
</div></body></html>
