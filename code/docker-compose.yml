services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: laundryhub
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # lets `app` wait until Postgres really accepts connections (not just "container started")
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundryhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/laundryhub
      DB_USER: laundry
      DB_PASSWORD: laundry
    ports:
      - "8080:8080"

volumes:
  pgdata:
